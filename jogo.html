  <style>
    table, tr, td {
      border: 1px solid black;
      border-collapse: collapse;
      margin: 10px auto;
      position: relative;
      z-index: 3;
    }

    td {
      width: 17px;
      height: 17px;
      background-color: #f0f0f0; /* Cor padrão (cinza claro) */
      transition: background-color 0.2s ease;
    }
    p:hover{
      color: white;
      transition: 1s;
      z-index: 4;
    }
    body{
        background-image: url("tunguinho.png");
        background-size: 100%;
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-position: center;
        background-size: justify;
        background-color: black;
        text-align: center;
        transition: 0.3s ease;
        align-items: center;
    }
    .sahur {
        animation-name: Tung;
        animation-iteration-count: infinite;
        animation-direction: alternate;
        background-image: url("sahuur.jpg");
        background-size: 100%;
        border-radius: 100px;
        width: 200px;
        height: 200px;
        position: relative;
        z-index: 1;
        animation-duration: 1.5s;
    }
    .original {
        animation-name: original;
        animation-direction: alternate;
        animation-iteration-count: infinite;
        background-image: url("original.png");
        background-size: 100%;
        border-radius: 100px;
        width: 100px;
        height: 100px;
        position: absolute;
        z-index: 1;
        animation-duration: 1.5s;
    }
    .botao{
      background-color: white;
      border-color: black;
      border-radius: 100%;
      width: 200px;
      height: 200px;
      background-image: url("baby.jpg");
      position: relative;
      left: 0;
      bottom: 5px;
      position: fixed;
      z-index: 2;
      }
    body:has(.botao:hover){
      background-image: url("tung.png");
    }
    .corC67430.ativo {
      background-color: #C67430; /* Cor ao clicar (C67430) */
      color: white;
    }

    .corDB9E4A{

    }
    @keyframes Tung {
      0% {
          left: 0px;
      }
      100% {
          left: 89%;
      }
    }
    @keyframes original {
      0% {
        transform: rotate(0deg) ;
